<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sequência — hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151b;
    --bg-soft: #171b23;
    --card: #1b2029;
    --card-hi: #212734;
    --line: #2a3140;
    --text: #edeff3;
    --muted: #838da0;
    --muted-2: #5b6577;
    --amber: #f2a93b;
    --amber-dim: #6b5220;
    --teal: #34c48f;
    --teal-dim: #16412f;
    --coral: #e8615f;
    --violet: #9d8cf2;
    --sky: #4fb5e8;
    --radius: 18px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% -10%, #1a2029 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Sora', system-ui, sans-serif;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: 92px;
  }

  /* ---------- HEADER ---------- */
  header.top{
    padding: 28px 20px 14px;
  }
  .top-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .greeting-label{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); font-weight:600;}
  .greeting-date{font-size:22px; font-weight:700; margin-top:4px; text-transform:capitalize;}
  .flame-chip{
    display:flex; align-items:center; gap:7px;
    background: linear-gradient(160deg, #2a2013, #1c1710);
    border:1px solid #4a361a;
    padding:9px 14px 9px 11px;
    border-radius: 999px;
  }
  .flame-chip .n{font-weight:800; font-size:17px; color:var(--amber); font-family:'IBM Plex Mono',monospace;}
  .flame-chip .lbl{font-size:10px; color:#c99a4d; letter-spacing:.06em;}

  .momentum{
    margin: 18px 20px 4px;
    background: linear-gradient(150deg, var(--card-hi), var(--card) 70%);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    position: relative;
    overflow:hidden;
  }
  .momentum::before{
    content:"";
    position:absolute; inset:-40% -20% auto auto;
    width:220px; height:220px;
    background: radial-gradient(circle, rgba(242,169,59,.16), transparent 70%);
    pointer-events:none;
  }
  .momentum-top{display:flex; justify-content:space-between; align-items:baseline;}
  .momentum-top .big{font-size:34px; font-weight:800; letter-spacing:-.02em;}
  .momentum-top .big span{font-size:16px; color:var(--muted); font-weight:600;}
  .momentum-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .chain{
    display:flex; gap:6px; margin-top:16px;
  }
  .chain .link{
    flex:1;
    height:8px;
    border-radius:4px;
    background: var(--line);
    position:relative;
    overflow:hidden;
  }
  .chain .link.done{background: linear-gradient(90deg, var(--amber), #f6c977);}
  .chain .link.today{outline:2px solid rgba(242,169,59,.5); outline-offset:2px;}
  .chain-labels{display:flex; justify-content:space-between; margin-top:6px;}
  .chain-labels span{font-size:9.5px; color:var(--muted-2); flex:1; text-align:center;}

  /* ---------- TABS ---------- */
  .tabbar{
    display:flex; gap:6px;
    margin: 22px 20px 8px;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .tabbar button{
    flex:1; border:none; background:transparent; color:var(--muted);
    font-family:inherit; font-weight:600; font-size:13.5px;
    padding:9px 0; border-radius:999px; cursor:pointer;
    transition: background .18s, color .18s;
  }
  .tabbar button.active{background: var(--card-hi); color:var(--text);}

  section.view{padding: 6px 20px 4px; display:none; animation: fadeIn .25s ease;}
  section.view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .section-label{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted-2); font-weight:700; margin: 18px 2px 10px;
  }
  .cat-label{
    display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:750; color: var(--hc, var(--text));
    margin: 22px 2px 10px; padding-bottom:8px;
    border-bottom: 1px solid var(--line);
  }
  .cat-label:first-child{margin-top:2px;}
  .cat-label span:first-child{font-size:14px;}
  .cat-count{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; font-weight:500;
    color:var(--muted-2); font-size:11px;
  }

  /* ---------- HABIT CARD ---------- */
  .habit-card{
    display:flex; align-items:center; gap:13px;
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 10px;
    cursor:pointer;
    position:relative;
    transition: border-color .15s, transform .1s;
  }
  .habit-card:active{transform: scale(.985);}
  .habit-card.done{border-color: var(--hc, var(--teal)); }
  .h-icon{
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    background: color-mix(in srgb, var(--hc, var(--sky)) 18%, transparent);
  }
  .h-mid{flex:1; min-width:0;}
  .h-name{font-weight:650; font-size:15px;}
  .h-meta{display:flex; gap:8px; align-items:center; margin-top:4px;}
  .h-meta .streak{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .h-mini{display:flex; gap:3px; margin-top:7px;}
  .h-mini i{width:12px; height:12px; border-radius:3px; background:var(--line); display:block;}
  .h-mini i.on{background: var(--hc, var(--teal));}
  .h-check{
    width:34px; height:34px; border-radius:50%;
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; cursor:pointer; font-size:16px; color:transparent;
    transition: all .15s;
  }
  .h-check.on{background: var(--hc, var(--teal)); border-color: var(--hc, var(--teal)); color:#0d1410;}

  .empty{
    text-align:center; padding: 46px 20px; color:var(--muted);
  }
  .empty .glyph{font-size:34px; margin-bottom:10px;}
  .empty .t{font-weight:700; color:var(--text); font-size:15px; margin-bottom:5px;}
  .empty .d{font-size:13px; line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position: fixed; left:50%; bottom:96px;
    transform: translateX(146px);
    width:54px; height:54px; border-radius:50%;
    background: linear-gradient(150deg, #f6c977, var(--amber));
    color:#241a06; border:none; font-size:26px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px -6px rgba(242,169,59,.55);
    cursor:pointer; z-index:40;
  }
  @media (min-width:480px){ .fab{ left:50%; margin-left:190px; transform:none; } }

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{
    position: fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background: rgba(23,27,35,.9);
    backdrop-filter: blur(14px);
    border-top:1px solid var(--line);
    display:flex; z-index:30;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--muted-2);
    font-family:inherit; font-size:10.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 0; cursor:pointer;
  }
  nav.bottom button .ic{font-size:19px;}
  nav.bottom button.active{color:var(--amber);}

  /* ---------- DETAIL VIEW ---------- */
  .detail-head{display:flex; align-items:center; gap:12px; padding:4px 0 10px;}
  .back-btn{
    width:36px; height:36px; border-radius:50%; background:var(--card);
    border:1px solid var(--line); color:var(--text); font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .detail-title{font-size:19px; font-weight:750; flex:1;}
  .detail-icon-lg{
    width:50px;height:50px;border-radius:14px;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    background: color-mix(in srgb, var(--hc, var(--sky)) 20%, transparent);
  }
  .icon-btn{
    width:36px;height:36px;border-radius:50%;background:var(--card);
    border:1px solid var(--line); color:var(--muted); font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .ring-card{
    display:flex; align-items:center; gap:20px;
    background: var(--card); border:1px solid var(--line);
    border-radius: var(--radius); padding:20px; margin:14px 0;
  }
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0;}
  .stat-box{
    background:var(--card); border:1px solid var(--line); border-radius: var(--radius-sm);
    padding:12px 10px; text-align:center;
  }
  .stat-box .v{font-size:19px; font-weight:800; font-family:'IBM Plex Mono',monospace;}
  .stat-box .l{font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:.04em;}

  .heat-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:14px 0;}
  .heat-grid{display:grid; grid-template-columns: repeat(13, 1fr); gap:4px;}
  .heat-cell{aspect-ratio:1; border-radius:3px; background:var(--line);}
  .heat-legend{display:flex; align-items:center; gap:5px; justify-content:flex-end; margin-top:10px; font-size:9.5px; color:var(--muted-2);}
  .heat-legend i{width:9px;height:9px;border-radius:2px; display:inline-block;}

  .week-chart{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 16px 10px; margin:14px 0;}
  .week-bars{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:10px;}
  .week-bars .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .week-bars .bar{width:100%; border-radius:5px 5px 3px 3px; background:var(--line); min-height:4px; transition:height .4s ease;}
  .week-bars .lab{font-size:9.5px; color:var(--muted-2); margin-top:6px;}

  .danger-zone{margin-top:26px; text-align:center;}
  .danger-zone button{
    background:none; border:1px solid #4a2626; color:var(--coral);
    font-family:inherit; font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:999px; cursor:pointer;
  }

  /* ---------- STATS VIEW ---------- */
  .overview-card{
    background: linear-gradient(150deg, var(--card-hi), var(--card));
    border:1px solid var(--line); border-radius:var(--radius); padding:18px;
    margin-bottom:14px;
  }
  .overview-row{display:flex; justify-content:space-between; align-items:center;}
  .overview-row .v{font-size:28px; font-weight:800;}
  .overview-row .l{font-size:11.5px; color:var(--muted);}
  .rank-row{
    display:flex; align-items:center; gap:11px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .rank-row:last-child{border-bottom:none;}
  .rank-num{font-family:'IBM Plex Mono',monospace; color:var(--muted-2); font-size:12px; width:16px;}
  .rank-bar-wrap{flex:1; height:7px; border-radius:4px; background:var(--line); overflow:hidden;}
  .rank-bar{height:100%; border-radius:4px;}
  .rank-pct{font-size:11.5px; font-family:'IBM Plex Mono',monospace; color:var(--muted); width:34px; text-align:right;}

  /* ---------- MODAL ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(8,10,14,.65);
    backdrop-filter: blur(2px);
    z-index:50; display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%; max-width:480px; background:var(--bg-soft);
    border:1px solid var(--line); border-bottom:none;
    border-radius: 24px 24px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto;
    animation: slideUp .28s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 14px;}
  .sheet h2{font-size:18px; margin:0 0 16px;}
  .field{margin-bottom:16px;}
  .field label{font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; display:block; margin-bottom:8px;}
  .field input[type=text]{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:15px; padding:12px 14px; border-radius:12px;
  }
  .swatches{display:flex; gap:9px; flex-wrap:wrap;}
  .swatch{width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.sel{border-color:#fff;}
  .icon-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .icon-opt{
    width:40px; height:40px; border-radius:10px; background:var(--card);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
  }
  .icon-opt.sel{border-color:var(--amber); background: rgba(242,169,59,.14);}
  .day-toggle{display:flex; gap:6px;}
  .day-toggle button{
    flex:1; padding:9px 0; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); font-family:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .day-toggle button.sel{background:var(--amber-dim); border-color:var(--amber); color:var(--amber);}
  .freq-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .freq-toggle button{
    flex:1; padding:10px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); font-family:inherit; font-weight:650; font-size:13px; cursor:pointer;
  }
  .freq-toggle button.sel{background:var(--card-hi); border-color:var(--amber); color:var(--text);}
  .save-btn{
    width:100%; padding:15px; border:none; border-radius:14px;
    background: linear-gradient(150deg, #f6c977, var(--amber)); color:#241a06;
    font-family:inherit; font-weight:800; font-size:15px; cursor:pointer; margin-top:4px;
  }
  .toast{
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%);
    background:var(--card-hi); border:1px solid var(--line); color:var(--text);
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
    z-index:60; opacity:0; pointer-events:none; transition: opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="top-row">
      <div>
        <div class="greeting-label" id="greetLabel">Bom dia</div>
        <div class="greeting-date" id="dateLabel">—</div>
      </div>
      <div class="flame-chip">
        <span>🔥</span>
        <div>
          <div class="n" id="flameCount">0</div>
        </div>
      </div>
    </div>

    <div class="momentum">
      <div class="momentum-top">
        <div class="big" id="momentumPct">0<span>%</span></div>
        <div style="text-align:right">
          <div style="font-size:12px;color:var(--muted)" id="momentumFrac">0/0 hoje</div>
        </div>
      </div>
      <div class="momentum-sub">Ritmo dos últimos 7 dias</div>
      <div class="chain" id="chainRow"></div>
      <div class="chain-labels" id="chainLabels"></div>
    </div>
  </header>

  <div class="tabbar">
    <button class="active" data-tab="today">Hoje</button>
    <button data-tab="habits">Hábitos</button>
    <button data-tab="stats">Estatísticas</button>
  </div>

  <!-- TODAY -->
  <section class="view active" id="view-today">
    <div id="todayList"></div>
  </section>

  <!-- HABITS LIST -->
  <section class="view" id="view-habits">
    <div id="habitsList"></div>
  </section>

  <!-- STATS -->
  <section class="view" id="view-stats">
    <div class="overview-card">
      <div class="overview-row">
        <div>
          <div class="v" id="ovTotal">0</div>
          <div class="l">conclusões no total</div>
        </div>
        <div style="text-align:right">
          <div class="v" id="ovBest">0</div>
          <div class="l">melhor sequência</div>
        </div>
      </div>
    </div>
    <div class="section-label">Por área da vida</div>
    <div id="categoryStats" class="stat-grid"></div>

    <div class="section-label">Ranking da semana</div>
    <div id="rankList"></div>
  </section>

  <!-- DETAIL -->
  <section class="view" id="view-detail"></section>

  <button class="fab" id="fabAdd">+</button>

  <nav class="bottom">
    <button class="active" data-tab="today"><span class="ic">✅</span>Hoje</button>
    <button data-tab="habits"><span class="ic">📋</span>Hábitos</button>
    <button data-tab="stats"><span class="ic">📊</span>Estatísticas</button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">Novo hábito</h2>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="fName" placeholder="Ex: Beber água, Ler 10 páginas...">
    </div>
    <div class="field">
      <label>Área da vida</label>
      <div class="freq-toggle" id="categoryToggle"></div>
    </div>
    <div class="field">
      <label>Ícone</label>
      <div class="icon-grid" id="iconGrid"></div>
    </div>
    <div class="field">
      <label>Cor</label>
      <div class="swatches" id="colorGrid"></div>
    </div>
    <div class="field">
      <label>Frequência</label>
      <div class="freq-toggle">
        <button id="freqDaily" class="sel">Todo dia</button>
        <button id="freqCustom">Dias específicos</button>
      </div>
      <div class="day-toggle" id="dayToggle"></div>
    </div>
    <button class="save-btn" id="saveHabitBtn">Salvar hábito</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const COLORS = ['#f2a93b','#34c48f','#9d8cf2','#4fb5e8','#e8615f','#e07fc9'];
  const ICONS = ['💧','📖','🏃','🧘','✍️','💪','🎸','🥗','😴','🚭','💰','🧹','☎️','🎯','🌱','☀️'];
  const WEEKDAYS = ['D','S','T','Q','Q','S','S'];
  const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const CATEGORIES = [
    {id:'pessoal',       label:'Pessoal',       icon:'🌿', color:'#4fb5e8'},
    {id:'profissional',  label:'Profissional',  icon:'💼', color:'#f2a93b'},
    {id:'espiritual',    label:'Espiritual',    icon:'✨', color:'#9d8cf2'},
  ];
  const catInfo = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES[0];

  let habits = [];
  let entries = {}; // { habitId: { 'YYYY-MM-DD': true } }
  let currentDetail = null;
  let editingIconIdx = 0, editingColorIdx = 0, editingFreq = 'daily', editingDays = [1,2,3,4,5,6,0], editingCategory = 'pessoal';

  const $ = (s,r=document) => r.querySelector(s);
  const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
  const pad = n => String(n).padStart(2,'0');
  const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayKey = () => dkey(new Date());

  function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // Armazenamento local: usa window.storage quando disponível (ambiente Claude),
  // e cai para localStorage automaticamente quando o app roda fora (navegador comum, celular etc.)
  const hasClaudeStorage = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

  async function storageGet(key){
    if(hasClaudeStorage()){
      try{
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }catch(e){ return null; }
    }
    return localStorage.getItem(key);
  }
  async function storageSet(key, value){
    if(hasClaudeStorage()){
      try{ await window.storage.set(key, value, false); return; }catch(e){ /* fall through to localStorage as backup */ }
    }
    try{ localStorage.setItem(key, value); }catch(e){ console.error('Falha ao salvar localmente', e); }
  }

  async function loadData(){
    const h = await storageGet('habits');
    habits = h ? JSON.parse(h) : [];
    const e = await storageGet('entries');
    entries = e ? JSON.parse(e) : {};

    if(habits.length === 0){
      habits = [
        {id:'h1', name:'Beber água', icon:'💧', color:'#4fb5e8', freq:'daily', days:[0,1,2,3,4,5,6], category:'pessoal', created: todayKey()},
        {id:'h2', name:'Ler a Bíblia', icon:'✨', color:'#9d8cf2', freq:'daily', days:[0,1,2,3,4,5,6], category:'espiritual', created: todayKey()},
        {id:'h3', name:'Planejar a rota', icon:'🎯', color:'#f2a93b', freq:'custom', days:[1,2,3,4,5], category:'profissional', created: todayKey()},
      ];
      await saveHabits();
    } else {
      // migração: hábitos criados antes da categoria existir viram "pessoal" por padrão
      let migrated = false;
      habits.forEach(h=>{ if(!h.category){ h.category='pessoal'; migrated = true; } });
      if(migrated) await saveHabits();
    }
    render();
  }

  async function saveHabits(){ await storageSet('habits', JSON.stringify(habits)); }
  async function saveEntries(){ await storageSet('entries', JSON.stringify(entries)); }

  function isScheduled(h, date){
    return h.freq === 'daily' || (h.days || []).includes(date.getDay());
  }
  function isDone(hid, key){ return !!(entries[hid] && entries[hid][key]); }

  async function toggleDone(hid, key){
    if(!entries[hid]) entries[hid] = {};
    if(entries[hid][key]) delete entries[hid][key];
    else entries[hid][key] = true;
    await saveEntries();
    render();
  }

  function currentStreak(hid){
    let streak = 0;
    let d = new Date();
    const h = habits.find(x=>x.id===hid);
    if(!h) return 0;
    // if today scheduled and not done yet, start counting from yesterday
    if(isScheduled(h,d) && !isDone(hid, dkey(d))){
      d.setDate(d.getDate()-1);
    }
    while(true){
      if(isScheduled(h, d)){
        if(isDone(hid, dkey(d))) streak++;
        else break;
      }
      d.setDate(d.getDate()-1);
      if(streak > 3650) break;
    }
    return streak;
  }

  function bestStreak(hid){
    const h = habits.find(x=>x.id===hid);
    if(!h) return 0;
    const dates = Object.keys(entries[hid]||{}).sort();
    if(dates.length===0) return 0;
    let best=0, cur=0, prev=null;
    // walk day by day from first entry to today counting scheduled-day continuity
    let d = new Date(dates[0]);
    const end = new Date();
    while(d<=end){
      if(isScheduled(h,d)){
        if(isDone(hid, dkey(d))){ cur++; best=Math.max(best,cur); }
        else cur=0;
      }
      d.setDate(d.getDate()+1);
    }
    return best;
  }

  function totalCompletions(hid){
    return Object.keys(entries[hid]||{}).length;
  }

  function scoreForRange(hid, days){
    const h = habits.find(x=>x.id===hid);
    if(!h) return 0;
    let scheduled=0, done=0;
    let d = new Date();
    for(let i=0;i<days;i++){
      if(isScheduled(h,d)){
        scheduled++;
        if(isDone(hid, dkey(d))) done++;
      }
      d.setDate(d.getDate()-1);
    }
    return scheduled ? Math.round(done/scheduled*100) : 0;
  }

  function overallFlame(){
    // consecutive days where all scheduled habits for that day were completed
    let streak = 0;
    let d = new Date();
    if(habits.length===0) return 0;
    const todayScheduled = habits.filter(h=>isScheduled(h,d));
    const todayAllDone = todayScheduled.length>0 && todayScheduled.every(h=>isDone(h.id, dkey(d)));
    if(!todayAllDone) d.setDate(d.getDate()-1);
    while(true){
      const sched = habits.filter(h=>isScheduled(h,d));
      if(sched.length===0){ d.setDate(d.getDate()-1); if(streak>3650)break; continue; }
      const allDone = sched.every(h=>isDone(h.id, dkey(d)));
      if(allDone) streak++;
      else break;
      d.setDate(d.getDate()-1);
      if(streak>3650) break;
    }
    return streak;
  }

  function render(){
    renderHeader();
    renderToday();
    renderHabitsList();
    renderStats();
    if(currentDetail) renderDetail(currentDetail);
  }

  function renderHeader(){
    const now = new Date();
    const hour = now.getHours();
    $('#greetLabel').textContent = hour<12 ? 'Bom dia' : hour<18 ? 'Boa tarde' : 'Boa noite';
    $('#dateLabel').textContent = `${now.getDate()} de ${MONTHS[now.getMonth()]}`;
    $('#flameCount').textContent = overallFlame();

    const today = new Date();
    const scheduledToday = habits.filter(h=>isScheduled(h,today));
    const doneToday = scheduledToday.filter(h=>isDone(h.id, todayKey()));
    const pct = scheduledToday.length ? Math.round(doneToday.length/scheduledToday.length*100) : 0;
    $('#momentumPct').innerHTML = `${pct}<span>%</span>`;
    $('#momentumFrac').textContent = `${doneToday.length}/${scheduledToday.length} hoje`;

    // 7-day chain: overall completion ratio per day
    const chain = $('#chainRow'); chain.innerHTML='';
    const labels = $('#chainLabels'); labels.innerHTML='';
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const sched = habits.filter(h=>isScheduled(h,d));
      const done = sched.filter(h=>isDone(h.id, dkey(d)));
      const ratio = sched.length ? done.length/sched.length : 0;
      const div = document.createElement('div');
      div.className = 'link' + (ratio>=0.999 ? ' done' : '') + (i===0 ? ' today':'');
      if(ratio>0 && ratio<1){ div.style.background = `linear-gradient(90deg, var(--amber) ${Math.round(ratio*100)}%, var(--line) ${Math.round(ratio*100)}%)`; }
      chain.appendChild(div);
      const lab = document.createElement('span');
      lab.textContent = WEEKDAYS[d.getDay()];
      labels.appendChild(lab);
    }
  }

  function habitMiniBars(h){
    let html = '';
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const on = isScheduled(h,d) && isDone(h.id, dkey(d));
      html += `<i class="${on?'on':''}" style="${on?`background:${h.color}`:''}"></i>`;
    }
    return html;
  }

  function todayCardHtml(h){
    const done = isDone(h.id, todayKey());
    const streak = currentStreak(h.id);
    return `
    <div class="habit-card ${done?'done':''}" style="--hc:${h.color}" data-id="${h.id}">
      <div class="h-icon" style="--hc:${h.color}">${h.icon}</div>
      <div class="h-mid">
        <div class="h-name">${escapeHtml(h.name)}</div>
        <div class="h-meta"><span class="streak">🔥 ${streak}d</span></div>
        <div class="h-mini">${habitMiniBars(h)}</div>
      </div>
      <div class="h-check ${done?'on':''}" style="--hc:${h.color}" data-check="${h.id}">✓</div>
    </div>`;
  }

  function habitListCardHtml(h){
    const streak = currentStreak(h.id);
    const freqTxt = h.freq==='daily' ? 'Todo dia' : (h.days||[]).map(d=>WEEKDAYS[d]).join(' ');
    return `
    <div class="habit-card" style="--hc:${h.color}" data-open="${h.id}">
      <div class="h-icon" style="--hc:${h.color}">${h.icon}</div>
      <div class="h-mid">
        <div class="h-name">${escapeHtml(h.name)}</div>
        <div class="h-meta"><span class="streak">${freqTxt} · 🔥 ${streak}d</span></div>
      </div>
      <div class="icon-btn" style="width:30px;height:30px;font-size:13px">›</div>
    </div>`;
  }

  function categorySectionLabel(cat, count){
    return `<div class="cat-label" style="--hc:${cat.color}"><span>${cat.icon}</span>${cat.label}<span class="cat-count">${count}</span></div>`;
  }

  function groupByCategory(list){
    const groups = {};
    CATEGORIES.forEach(c=>groups[c.id]=[]);
    list.forEach(h=>{ const cid = h.category && groups[h.category] ? h.category : 'pessoal'; groups[cid].push(h); });
    return groups;
  }

  function renderToday(){
    const list = $('#todayList');
    const today = new Date();
    const scheduled = habits.filter(h=>isScheduled(h,today));
    if(scheduled.length===0){
      list.innerHTML = `<div class="empty"><div class="glyph">🌱</div><div class="t">Nada agendado pra hoje</div><div class="d">Toque no + para criar seu primeiro hábito.</div></div>`;
      return;
    }
    const groups = groupByCategory(scheduled);
    let html = '';
    CATEGORIES.forEach(cat=>{
      const items = groups[cat.id];
      if(items.length===0) return;
      html += categorySectionLabel(cat, items.length);
      html += items.map(todayCardHtml).join('');
    });
    list.innerHTML = html;
  }

  function renderHabitsList(){
    const list = $('#habitsList');
    if(habits.length===0){
      list.innerHTML = `<div class="empty"><div class="glyph">📋</div><div class="t">Nenhum hábito ainda</div><div class="d">Crie hábitos diários ou em dias específicos da semana.</div></div>`;
      return;
    }
    const groups = groupByCategory(habits);
    let html = '';
    CATEGORIES.forEach(cat=>{
      const items = groups[cat.id];
      if(items.length===0) return;
      html += categorySectionLabel(cat, items.length);
      html += items.map(habitListCardHtml).join('');
    });
    list.innerHTML = html;
  }

  function renderStats(){
    let total=0, best=0;
    habits.forEach(h=>{ total += totalCompletions(h.id); best = Math.max(best, bestStreak(h.id)); });
    $('#ovTotal').textContent = total;
    $('#ovBest').textContent = best;

    const catStats = $('#categoryStats');
    const groups = groupByCategory(habits);
    catStats.innerHTML = CATEGORIES.map(cat=>{
      const items = groups[cat.id];
      if(items.length===0) return `<div class="stat-box" style="opacity:.4"><div class="v">–</div><div class="l">${cat.icon} ${cat.label}</div></div>`;
      const avg = Math.round(items.reduce((s,h)=>s+scoreForRange(h.id,7),0)/items.length);
      return `<div class="stat-box"><div class="v" style="color:${cat.color}">${avg}%</div><div class="l">${cat.icon} ${cat.label}</div></div>`;
    }).join('');

    const ranked = habits.map(h=>({h, pct: scoreForRange(h.id,7)})).sort((a,b)=>b.pct-a.pct);
    const rankList = $('#rankList');
    if(ranked.length===0){ rankList.innerHTML = ''; return; }
    rankList.innerHTML = ranked.map((r,i)=>`
      <div class="rank-row">
        <div class="rank-num">${i+1}</div>
        <div style="font-size:17px">${r.h.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;margin-bottom:5px">${escapeHtml(r.h.name)}</div>
          <div class="rank-bar-wrap"><div class="rank-bar" style="width:${r.pct}%;background:${r.h.color}"></div></div>
        </div>
        <div class="rank-pct">${r.pct}%</div>
      </div>
    `).join('');
  }

  function renderDetail(hid){
    const h = habits.find(x=>x.id===hid);
    if(!h) return;
    const streak = currentStreak(hid);
    const best = bestStreak(hid);
    const total = totalCompletions(hid);
    const score30 = scoreForRange(hid,30);

    // week bars (last 7 days, per-habit binary as % — 0 or 100, but render as height)
    let weekHtml = '';
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const sched = isScheduled(h,d);
      const done = sched && isDone(hid, dkey(d));
      const height = sched ? (done ? 100 : 14) : 6;
      weekHtml += `<div class="col"><div class="bar" style="height:${height}%;background:${done?h.color:'var(--line)'}"></div><div class="lab">${WEEKDAYS[d.getDay()]}</div></div>`;
    }

    // heatmap: last 13*7 = 91 days
    let cells = [];
    for(let i=90;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const sched = isScheduled(h,d);
      const done = sched && isDone(hid, dkey(d));
      cells.push({d, sched, done});
    }
    const heatHtml = cells.map(c=>{
      let bg = 'var(--line)';
      if(c.sched && c.done) bg = c.h_color || h.color;
      else if(!c.sched) bg = 'rgba(255,255,255,.03)';
      return `<div class="heat-cell" style="background:${bg}" title="${dkey(c.d)}"></div>`;
    }).join('');

    const view = $('#view-detail');
    view.innerHTML = `
      <div class="detail-head">
        <div class="back-btn" id="detailBack">←</div>
        <div class="detail-icon-lg" style="--hc:${h.color}">${h.icon}</div>
        <div class="detail-title">${escapeHtml(h.name)}</div>
        <div class="icon-btn" id="detailDelete">🗑</div>
      </div>

      <div class="ring-card">
        ${svgRing(score30, h.color)}
        <div>
          <div style="font-size:22px;font-weight:800">${score30}%</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">taxa de conclusão · 30 dias</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-box"><div class="v" style="color:${h.color}">${streak}</div><div class="l">sequência atual</div></div>
        <div class="stat-box"><div class="v">${best}</div><div class="l">melhor sequência</div></div>
        <div class="stat-box"><div class="v">${total}</div><div class="l">total</div></div>
      </div>

      <div class="week-chart">
        <div class="section-label" style="margin-top:0">Últimos 7 dias</div>
        <div class="week-bars">${weekHtml}</div>
      </div>

      <div class="heat-wrap">
        <div class="section-label" style="margin-top:0">Últimos 90 dias</div>
        <div class="heat-grid">${heatHtml}</div>
        <div class="heat-legend"><span>menos</span><i style="background:var(--line)"></i><i style="background:${h.color};opacity:.4"></i><i style="background:${h.color}"></i><span>mais</span></div>
      </div>

      <div class="danger-zone">
        <button id="deleteHabitBtn">Excluir hábito</button>
      </div>
    `;
    $('#detailBack').onclick = ()=>{ currentDetail=null; switchTab('habits'); };
    $('#detailDelete').onclick = $('#deleteHabitBtn').onclick = async ()=>{
      if(confirm(`Excluir "${h.name}"? Isso apaga todo o histórico.`)){
        habits = habits.filter(x=>x.id!==hid);
        delete entries[hid];
        await saveHabits(); await saveEntries();
        currentDetail = null;
        switchTab('habits');
        toast('Hábito excluído');
      }
    };
  }

  function svgRing(pct, color){
    const r = 30, c = 2*Math.PI*r;
    const off = c - (pct/100)*c;
    return `<svg width="76" height="76" viewBox="0 0 76 76" style="flex-shrink:0">
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="8"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
        transform="rotate(-90 38 38)"/>
    </svg>`;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function switchTab(tab){
    currentDetail = tab==='detail' ? currentDetail : null;
    $$('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    $$('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    $$('section.view').forEach(v=>v.classList.remove('active'));
    $('#view-'+tab).classList.add('active');
  }

  function openDetail(hid){
    currentDetail = hid;
    $$('section.view').forEach(v=>v.classList.remove('active'));
    $('#view-detail').classList.add('active');
    renderDetail(hid);
  }

  // ---------- events ----------
  document.body.addEventListener('click', (e)=>{
    const chk = e.target.closest('[data-check]');
    if(chk){ e.stopPropagation(); toggleDone(chk.dataset.check, todayKey()); return; }
    const card = e.target.closest('[data-id]');
    if(card && card.closest('#todayList')){ openDetail(card.dataset.id); return; }
    const open = e.target.closest('[data-open]');
    if(open){ openDetail(open.dataset.open); return; }
  });

  $$('.tabbar button, nav.bottom button').forEach(b=>{
    b.addEventListener('click', ()=> switchTab(b.dataset.tab));
  });

  // ---------- add habit sheet ----------
  function buildIconGrid(){
    $('#iconGrid').innerHTML = ICONS.map((ic,i)=>`<div class="icon-opt ${i===editingIconIdx?'sel':''}" data-i="${i}">${ic}</div>`).join('');
  }
  function buildColorGrid(){
    $('#colorGrid').innerHTML = COLORS.map((c,i)=>`<div class="swatch ${i===editingColorIdx?'sel':''}" data-i="${i}" style="background:${c}"></div>`).join('');
  }
  function buildDayToggle(){
    $('#dayToggle').innerHTML = WEEKDAYS.map((d,i)=>`<button data-d="${i}" class="${editingDays.includes(i)?'sel':''}">${d}</button>`).join('');
  }
  function buildCategoryToggle(){
    $('#categoryToggle').innerHTML = CATEGORIES.map(c=>
      `<button data-cat="${c.id}" class="${editingCategory===c.id?'sel':''}">${c.icon} ${c.label}</button>`
    ).join('');
  }
  $('#categoryToggle').addEventListener('click', (e)=>{
    const b = e.target.closest('button'); if(!b) return;
    editingCategory = b.dataset.cat;
    buildCategoryToggle();
  });

  $('#fabAdd').addEventListener('click', ()=>{
    $('#fName').value = '';
    editingIconIdx = Math.floor(Math.random()*ICONS.length);
    editingColorIdx = Math.floor(Math.random()*COLORS.length);
    editingFreq = 'daily';
    editingDays = [0,1,2,3,4,5,6];
    editingCategory = 'pessoal';
    $('#freqDaily').classList.add('sel'); $('#freqCustom').classList.remove('sel');
    $('#dayToggle').style.display = 'none';
    buildIconGrid(); buildColorGrid(); buildDayToggle(); buildCategoryToggle();
    $('#sheetBackdrop').classList.add('open');
  });

  $('#sheetBackdrop').addEventListener('click', (e)=>{ if(e.target===$('#sheetBackdrop')) $('#sheetBackdrop').classList.remove('open'); });

  $('#iconGrid').addEventListener('click', (e)=>{
    const o = e.target.closest('.icon-opt'); if(!o) return;
    editingIconIdx = +o.dataset.i; buildIconGrid();
  });
  $('#colorGrid').addEventListener('click', (e)=>{
    const o = e.target.closest('.swatch'); if(!o) return;
    editingColorIdx = +o.dataset.i; buildColorGrid();
  });
  $('#freqDaily').addEventListener('click', ()=>{
    editingFreq='daily'; editingDays=[0,1,2,3,4,5,6];
    $('#freqDaily').classList.add('sel'); $('#freqCustom').classList.remove('sel');
    $('#dayToggle').style.display='none';
  });
  $('#freqCustom').addEventListener('click', ()=>{
    editingFreq='custom'; editingDays=[];
    $('#freqCustom').classList.add('sel'); $('#freqDaily').classList.remove('sel');
    $('#dayToggle').style.display='flex'; buildDayToggle();
  });
  $('#dayToggle').addEventListener('click', (e)=>{
    const b = e.target.closest('button'); if(!b) return;
    const d = +b.dataset.d;
    if(editingDays.includes(d)) editingDays = editingDays.filter(x=>x!==d);
    else editingDays.push(d);
    buildDayToggle();
  });

  $('#saveHabitBtn').addEventListener('click', async ()=>{
    const name = $('#fName').value.trim();
    if(!name){ toast('Dê um nome ao hábito'); return; }
    if(editingFreq==='custom' && editingDays.length===0){ toast('Escolha ao menos um dia'); return; }
    const h = {
      id: 'h'+Date.now(),
      name,
      icon: ICONS[editingIconIdx],
      color: COLORS[editingColorIdx],
      freq: editingFreq,
      days: editingFreq==='daily' ? [0,1,2,3,4,5,6] : editingDays.slice(),
      category: editingCategory,
      created: todayKey()
    };
    habits.push(h);
    await saveHabits();
    $('#sheetBackdrop').classList.remove('open');
    render();
    toast('Hábito criado 🎉');
  });

  loadData();
})();
</script>
</body>
</html>

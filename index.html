<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construtor de Hábitos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e3e7ec;--bg2:#c2c9d2;--card:#f7f9fb;--card2:#dde2e8;--ink:#1b2128;--muted:#566070;--line:#b9c1cb;--accent:#3d4b5f;--sky:#e8f0f8;--water:#9fb4c8;--grass:#a3aeb9;--roof:#55606e;--stone:#b9c1cb;--stone2:#8d97a3;--gold:#fdfdff;--track:#cfd5dc;--shine:rgba(255,255,255,.7);--btn1:#6a7b95;--btn2:#2f3b4d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#15181c;--bg2:#2a3037;--card:#23282e;--card2:#2f353d;--ink:#eef1f5;--muted:#a3adb9;--line:#434b55;--accent:#b4c2d6;--sky:#2f3d4b;--water:#3b5266;--grass:#55606b;--roof:#aab4c1;--stone:#c0c8d2;--stone2:#8e98a5;--gold:#ffffff;--track:#3a414a;--shine:rgba(255,255,255,.08);--btn1:#e9eef5;--btn2:#9aa7b8;--btnink:#12161b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(115deg,transparent 28%,var(--shine) 40%,transparent 52%),linear-gradient(160deg,var(--bg2),var(--bg) 55%,var(--bg2));background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.sum{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;font-size:14px;background:var(--card)}
.sum b{font-size:16px}
form{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
input,select{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
input{flex:1 1 100%;min-width:0}
select{flex:1}
button{font:inherit;cursor:pointer}
.add{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--btnink);border:1px solid var(--line);border-radius:12px;padding:0 22px;font-weight:600;box-shadow:inset 0 1px 0 var(--shine)}
.card{background:linear-gradient(135deg,var(--card) 0,var(--card2) 48%,var(--card) 52%,var(--card2) 100%);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:inset 0 1px 0 var(--shine),0 6px 18px #0002}
.art{background:var(--sky);border-radius:12px;overflow:hidden;line-height:0;position:relative;border:1px solid var(--line)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,var(--shine) 44%,transparent 56%);pointer-events:none}
.art svg{width:100%;height:auto;display:block}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 2px}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.streak{font-weight:700;white-space:nowrap}
.stage{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(180deg,var(--btn1),var(--btn2));border-radius:99px;transition:width .4s}
.next{font-size:12px;color:var(--muted)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.st div{background:var(--track);border-radius:10px;padding:8px 2px;text-align:center}
.st b{display:block;font-size:18px}
.st span{font-size:11px;color:var(--muted)}
.hl{font-size:12px;color:var(--muted);margin-top:10px}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:4px 0 8px}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--track)}
.hm i.on{background:linear-gradient(180deg,var(--btn1),var(--btn2))}
.hm i.t{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:13px;margin:6px 0 0;font-weight:600}
.acts{display:flex;gap:8px;margin-top:12px}
.done{flex:1;padding:12px;border-radius:12px;border:2px solid var(--accent);background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--btnink);font-weight:700;box-shadow:inset 0 1px 0 var(--shine)}
.done.on{background:transparent;color:var(--accent);box-shadow:none}
.del{padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:2px dashed var(--line);border-radius:18px}
.legend{font-size:12px;color:var(--muted);margin-top:20px;text-align:center}
</style>
</head>
<body>
<main>
<h1>🏗️ Construtor de Hábitos</h1>
<p class="sub">Disciplina é repetição. Um dia de cada vez, tijolo por tijolo.</p>
<div class="sum" id="sum"></div>
<form id="f"><input id="n" placeholder="Novo hábito (ex.: Ler 10 min)" maxlength="40" autocomplete="off"><select id="t" aria-label="Tipo de construção"></select><button class="add" type="submit">Criar</button></form>
<div id="list"></div>
<p class="legend">Etapas: Fundação (1 dia) → 7 → 30 → 100 → 365 → Lendária (1000)</p>
</main>
<script>
var T=[0,1,7,30,100,365,1000],NAMES=["Terreno vazio","Fundação","Estrutura","Em construção","Quase pronta","Obra-prima","Lendária"];
var TYPES={castelo:["Castelo","🏰"],torre:["Torre","🗼"],ponte:["Ponte","🌉"],piramide:["Pirâmide","🔺"],muralha:["Muralha","🧱"]};
var S="var(--stone)",S2="var(--stone2)",GD="var(--gold)",DK="#2c3440";
var habits=[],armed=null;
function load(){try{habits=JSON.parse(localStorage.getItem("habitos-v1"))||[]}catch(e){habits=[]}}
function save(){try{localStorage.setItem("habitos-v1",JSON.stringify(habits))}catch(e){}}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streak(days){var s=new Set(days),d=new Date();if(!s.has(key(d)))d.setDate(d.getDate()-1);var c=0;while(s.has(key(d))){c++;d.setDate(d.getDate()-1)}return c}
function best(days){var a=days.slice().sort(),b=0,c=0,p=null;a.forEach(function(k){var d=new Date(k+"T12:00:00");if(p&&Math.round((d-p)/864e5)==1)c++;else c=1;if(c>b)b=c;p=d});return b}
function lastN(n,set){var r=[],d=new Date();d.setDate(d.getDate()-(n-1));for(var i=0;i<n;i++){r.push(set.has(key(d)));d.setDate(d.getDate()+1)}return r}
function consist(days){if(!days.length)return 0;var f=new Date(days.slice().sort()[0]+"T12:00:00"),w=Math.min(30,Math.round((new Date()-f)/864e5)+1);return Math.round(lastN(w,new Set(days)).filter(Boolean).length/w*100)}
function stageOf(s){var i=0;T.forEach(function(t,k){if(s>=t)i=k});return i}
function esc(t){return t.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function R(x,y,w,h,f){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>'}
function cren(x,y,w,f){var r="";for(var i=0;i<w;i+=6)r+=R(x+i,y-4,3.5,4,f);return r}
function art(t,s){
var g='<rect x="0" y="66" width="120" height="14" fill="'+(t=="ponte"?"var(--water)":"var(--grass)")+'"/>',o="",k;
if(s==0)o='<rect x="30" y="58" width="60" height="9" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>';
else if(t=="castelo"){
o=R(22,60,76,7,S);
if(s>=2)o+=R(28,46,64,14,S2);
if(s>=3)o+=R(28,36,64,24,S2)+cren(28,36,64,S2)+'<path d="M52 60V50a8 8 0 0 1 16 0V60Z" fill="'+DK+'"/>';
if(s>=4)o+=R(16,20,20,47,S)+R(84,20,20,47,S)+cren(16,20,20,S)+cren(84,20,20,S);
if(s>=5)o+=R(48,6,24,30,S)+cren(48,6,24,S)+'<line x1="60" y1="2" x2="60" y2="-6" stroke="var(--ink)" stroke-width="1.5"/><polygon points="60,-6 72,-2 60,2" fill="var(--accent)"/>';
if(s>=6)o='<ellipse cx="60" cy="36" rx="58" ry="40" fill="'+GD+'" opacity=".25"/>'+o+'<polygon points="14,20 26,6 38,20" fill="'+GD+'"/><polygon points="82,20 94,6 106,20" fill="'+GD+'"/><circle cx="40" cy="8" r="1.6" fill="'+GD+'"/><circle cx="82" cy="4" r="1.6" fill="'+GD+'"/>'}
else if(t=="torre"){
o=R(30,60,60,7,S);var f=s>=2?Math.min(s-1,5):0,w=0,top=60;
for(k=1;k<=f;k++){w=36-k*3;top=60-k*10;o+=R(60-w/2,top,w,10,k%2?S2:S)+R(58,top+3,4,5,DK)}
if(s>=5)o+='<polygon points="'+(60-w/2-2)+','+top+' 60,'+(top-12)+' '+(60+w/2+2)+','+top+'" fill="'+(s>=6?GD:"var(--roof)")+'"/>';
if(s>=6)o='<ellipse cx="60" cy="30" rx="50" ry="38" fill="'+GD+'" opacity=".3"/>'+o}
else if(t=="ponte"){
var L=Math.round(s/6*104);
for(k=0;k<5;k++)if(12+k*22<=8+L-4)o+=R(12+k*22,40,6,26,S);
o+=R(8,36,L,5,S2)+R(8,33,L,1.5,S);
if(s>=6)for(k=0;k<5;k++)o+=R(13+k*22,28,1.5,8,S)+'<circle cx="'+(13.75+k*22)+'" cy="27" r="2.6" fill="'+GD+'"/>'}
else if(t=="piramide"){
var n=Math.min(s,6);
for(k=0;k<n;k++){var w2=84-k*13;o+=R(60-w2/2,67-(k+1)*9,w2,9,k%2?S:S2)}
if(s>=6)o+='<polygon points="50.5,13 60,2 69.5,13" fill="'+GD+'"/><circle cx="104" cy="14" r="7" fill="'+GD+'"/>'}
else{
var hh=Math.min(s-1,4)*8;
o=R(8,60,104,7,S)+R(10,60-hh,100,hh,S2);
if(s>=3)o+=cren(10,60-hh,100,S2);
if(s>=4)o+='<path d="M52 60V48a8 8 0 0 1 16 0V60Z" fill="'+(s>=6?GD:DK)+'"/>';
if(s>=5)o+=R(2,14,18,53,S)+R(100,14,18,53,S)+cren(2,14,18,S)+cren(100,14,18,S);
if(s>=6)o='<ellipse cx="60" cy="34" rx="58" ry="38" fill="'+GD+'" opacity=".25"/>'+o+'<line x1="11" y1="10" x2="11" y2="0" stroke="var(--ink)"/><polygon points="11,0 21,3 11,6" fill="'+GD+'"/><line x1="109" y1="10" x2="109" y2="0" stroke="var(--ink)"/><polygon points="109,0 99,3 109,6" fill="'+GD+'"/>'}
return '<svg viewBox="0 -8 120 88" role="img" aria-label="'+NAMES[s]+'">'+g+o+'</svg>'}
function render(){
var today=key(new Date()),nd=habits.filter(function(h){return h.days.indexOf(today)>-1}).length,tot=habits.reduce(function(a,h){return a+h.days.length},0);
document.getElementById("sum").innerHTML='<span>Hoje: <b>'+nd+'/'+habits.length+'</b> cumpridos</span><span>Total: <b>'+tot+'</b> dias</span>';
var el=document.getElementById("list");
if(!habits.length){el.innerHTML='<div class="empty">Nenhum hábito ainda.<br>Escolha um tipo de construção e comece a obra.</div>';return}
el.innerHTML=habits.map(function(h){
var ty=h.type||"castelo",s=streak(h.days),st=stageOf(s),done=h.days.indexOf(today)>-1,bs=best(h.days),nx,pct=100,hint;
if(st<6){var a=T[st],b=T[st+1];pct=Math.round((s-a)/(b-a)*100);var f=b-s;nx="Faltam "+f+(f==1?" dia":" dias")+" para: "+NAMES[st+1]}else nx="Construção máxima alcançada 🏆";
if(done)hint="Feito hoje ✓ Volte amanhã.";else if(s>0)hint="Não quebre a corrente: faça hoje para chegar a "+(s+1)+" dias.";else if(h.days.length)hint="Corrente quebrada. Recomece hoje; sua melhor foi "+bs+".";else hint="Comece hoje: o primeiro tijolo.";
var hm=lastN(28,new Set(h.days)).map(function(v,i){return '<i class="'+(v?"on":"")+(i==27?" t":"")+'"></i>'}).join("");
return '<div class="card"><div class="art">'+art(ty,st)+'</div><div class="row"><span class="name">'+esc(h.name)+'</span><span class="streak">🔥 '+s+'</span></div><div class="stage">'+TYPES[ty][1]+' '+TYPES[ty][0]+' · '+NAMES[st]+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="next">'+nx+'</div>'+
'<div class="st"><div><b>'+h.days.length+'</b><span>Dias feitos</span></div><div><b>'+s+'</b><span>Sequência</span></div><div><b>'+bs+'</b><span>Melhor</span></div><div><b>'+consist(h.days)+'%</b><span>Constância</span></div></div>'+
'<div class="hl">Últimos 28 dias</div><div class="hm">'+hm+'</div><p class="hint">'+hint+'</p>'+
'<div class="acts"><button class="done'+(done?" on":"")+'" data-a="t" data-id="'+h.id+'">'+(done?"✓ Feito hoje":"Fiz hoje")+'</button><button class="del" data-a="d" data-id="'+h.id+'">'+(armed==h.id?"Confirmar?":"Remover")+'</button></div></div>'}).join("")}
document.getElementById("t").innerHTML=Object.keys(TYPES).map(function(k){return '<option value="'+k+'">'+TYPES[k][1]+' '+TYPES[k][0]+'</option>'}).join("");
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var i=document.getElementById("n"),v=i.value.trim();if(!v)return;habits.push({id:String(Date.now()),name:v,type:document.getElementById("t").value,days:[]});i.value="";save();render()});
document.getElementById("list").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var id=b.dataset.id,h=habits.filter(function(x){return x.id==id})[0];if(!h)return;
if(b.dataset.a=="t"){var t=key(new Date()),i=h.days.indexOf(t);if(i>-1)h.days.splice(i,1);else h.days.push(t);armed=null;save()}
else{if(armed==id){habits=habits.filter(function(x){return x.id!=id});armed=null;save()}else armed=id}
render()});
load();render();
</script>
</body>
</html>
